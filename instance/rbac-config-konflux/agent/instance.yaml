workflow: ./workflows/konflux-pr-squash
source: scheduled
runtime: opencode
provider: rehor-openai
model: gpt-6.1-terra
envs:
  - node          # nvm + Node.js
  - go            # goenv + Go
claude_md:
  strategy: append
# Sandbox image launched by the agent dispatcher for this profile.
image:
  repository: quay.io/redhat-services-prod/hcc-accessmanagement-tenant/fabric-access-ai-dev
  # Newest promoted Konflux build of main.
  tag: latest
# Non-secret profile settings for dispatcher wiring and the sandbox runner.
env:
  BOT_INSTANCE_ID: An Clochán Liag
  BOT_LABEL: hcc-ai-konflux-platform-accessmanagement
  BOT_CONFIG_PATH: instance/rbac-config-konflux
  BOT_EXECUTION_ENGINE: coordinator
# Declarative preflights (REHOR-231): the stock gh-pr-status plus this
# workflow's custom check, ported to the dispatcher's TS engine
# (@rehor/preflights) instead of the Python set.
preflights:
  - gh-pr-status
  - fabric-konflux-bot-prs
# Legacy KEDA windows of konflux-bot-fabric-access (deploy/template
# defaults): EU and US working hours OR together; the dispatcher starts no
# sessions outside them; in-flight sessions drain.
schedule:
  triggers:
    - timezone: Europe/Prague
      start: "0 9 * * 1-5"
      end: "0 23 * * 1-5"
    - timezone: America/New_York
      start: "0 9 * * 1-5"
      end: "0 18 * * 1-5"
