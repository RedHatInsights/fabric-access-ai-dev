review_label: dev-bot-review
repositories:
  insights-rbac:
    related:
      - id: rbac-config
        url: https://github.com/project-kessel/rbac-config
        relationship: Role and permission configuration consumed by RBAC.
      - id: hbi
        url: https://github.com/RedHatInsights/insights-host-inventory
        relationship: Host inventory integration.
      - id: kessel-inventory-api
        url: https://github.com/project-kessel/inventory-api
        relationship: Inventory authorization API contract.
      - id: kessel-inventory-consumer
        url: https://github.com/project-kessel/inventory-consumer
        relationship: Inventory event and relationship ingestion.
    docs:
      - id: rbac-config-readme
        url: https://github.com/project-kessel/rbac-config/blob/master/README.md
      - id: hbi-readme
        url: https://github.com/RedHatInsights/insights-host-inventory/blob/master/README.md
      - id: hbi-kessel-effects
        url: https://github.com/RedHatInsights/insights-host-inventory/blob/master/docs/kessel-effects-on-hbi.md
      - id: hbi-rbac-v2-groups-migration
        url: https://github.com/RedHatInsights/insights-host-inventory/blob/master/docs/design-docs/groups_rbac_v2_design_and_implementation_status.md
      - id: inventory-api-readme
        url: https://github.com/project-kessel/inventory-api/blob/main/README.md
      - id: inventory-consumer-readme
        url: https://github.com/project-kessel/inventory-consumer/blob/main/README.md
    jira:
      team_field: customfield_10001
      profiles:
        current-team:
          target_repository: project-kessel/insights-rbac
          team_name_env: ${BOT_JIRA_TEAM_NAME_INSIGHTS_RBAC}
          project_env: ${BOT_JIRA_PROJECT_INSIGHTS_RBAC}
          team_id_env: ${BOT_JIRA_TEAM_ID_INSIGHTS_RBAC}
          labels_env: ${BOT_JIRA_LABELS_INSIGHTS_RBAC}
        inventory-api:
          target_repository: project-kessel/inventory-api
          team_name_env: ${BOT_JIRA_TEAM_NAME_INVENTORY_API}
          project_env: ${BOT_JIRA_PROJECT_INVENTORY_API}
          team_id_env: ${BOT_JIRA_TEAM_ID_INVENTORY_API}
          labels_env: ${BOT_JIRA_LABELS_INVENTORY_API}
  inventory-api:
    related:
      - id: insights-rbac
        url: https://github.com/project-kessel/insights-rbac
        relationship: RBAC calls Inventory API for V2 authorization checks; API contract changes can break permission decisions.
      - id: rbac-config
        url: https://github.com/project-kessel/rbac-config
        relationship: Supplies SpiceDB schema and KSL configuration used by the Inventory relations integration.
      - id: inventory-consumer
        url: https://github.com/project-kessel/inventory-consumer
        relationship: Transforms provider events and reports resources through the Inventory API.
      - id: insights-host-inventory
        url: https://github.com/RedHatInsights/insights-host-inventory
        relationship: Produces host inventory events consumed by KIC and mapped to Inventory API resources.
    docs:
      - id: inventory-api-architecture
        url: https://github.com/project-kessel/inventory-api/blob/main/ARCHITECTURE.md
      - id: inventory-api-api-guidelines
        url: https://github.com/project-kessel/inventory-api/blob/main/api/GUIDELINES.md
      - id: insights-rbac-architecture
        url: https://github.com/project-kessel/insights-rbac/blob/master/docs/ARCHITECTURE.md
      - id: rbac-config-readme
        url: https://github.com/project-kessel/rbac-config/blob/master/README.md
      - id: inventory-consumer-readme
        url: https://github.com/project-kessel/inventory-consumer/blob/main/README.md
      - id: hbi-kessel-effects
        url: https://github.com/RedHatInsights/insights-host-inventory/blob/master/docs/kessel-effects-on-hbi.md
  rbac-config:
    related:
      - id: insights-rbac
        url: https://github.com/project-kessel/insights-rbac
        relationship: Service consuming RBAC configuration.
    docs: []
  insights-chrome:
    related:
      - id: chrome-service-backend
        url: https://github.com/RedHatInsights/chrome-service-backend
        relationship: Provides runtime/configuration APIs and the browser-event bridge consumed by Console Shell; backend implementation and ownership remain separate.
      - id: insights-rbac-ui
        url: https://github.com/RedHatInsights/insights-rbac-ui
        relationship: Hosted Console application consumes Chrome APIs; use it to check consumer compatibility while keeping application implementation separate.
      - id: insights-rbac-api
        url: https://github.com/project-kessel/insights-rbac
        relationship: Upstream RBAC permission API used by access-aware UI; authorization policy and enforcement remain separate from shell behavior.
      - id: inventory-api
        url: https://github.com/project-kessel/inventory-api
        relationship: Upstream inventory permission API referenced by shell access-aware integrations; inventory service ownership remains separate.
    docs:
      - id: frontend-component-catalog
        url: https://github.com/RedHatInsights/frontend-experience-docs/blob/master/pages/platform/component-catalog.md
      - id: insights-chrome-component
        url: https://github.com/RedHatInsights/frontend-experience-docs/blob/master/pages/platform/components/insights-chrome.md
      - id: chrome-service-overview
        url: https://github.com/RedHatInsights/frontend-experience-docs/blob/master/pages/platform/components/chrome-service.md
      - id: pluggable-ui-framework
        url: https://github.com/RedHatInsights/frontend-experience-docs/blob/master/pages/platform/components/pluggable-ui-framework.md
      - id: frontend-configuration-discovery
        url: https://github.com/RedHatInsights/frontend-experience-docs/blob/master/pages/platform/components/dynamic-navigation.md
      - id: navigation-and-auth
        url: https://github.com/RedHatInsights/frontend-experience-docs/blob/master/pages/platform/navigation-and-auth.md
    jira:
      team_field: customfield_10001
      profiles:
        insights-chrome:
          target_repository: RedHatInsights/insights-chrome
          team_name_env: ${BOT_JIRA_TEAM_NAME_INSIGHTS_CHROME}
          project_env: ${BOT_JIRA_PROJECT_INSIGHTS_CHROME}
          team_id_env: ${BOT_JIRA_TEAM_ID_INSIGHTS_CHROME}
          component_id_env: ${BOT_JIRA_COMPONENT_ID_INSIGHTS_CHROME}
          labels_env: ${BOT_JIRA_LABELS_INSIGHTS_CHROME}
