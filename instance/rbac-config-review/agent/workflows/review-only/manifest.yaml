name: review-only
type: workflow
description: Review labeled GitHub PRs across the configured repositories

preflight:
  - 01-review-queue.py

requires:
  mcp_servers:
    - bot-memory
    - mcp-atlassian
  env_vars:
    - BOT_INSTANCE_ID
  optional_env_vars:
    - BOT_JIRA_PROJECT_INSIGHTS_RBAC
    - BOT_JIRA_TEAM_ID_INSIGHTS_RBAC
    - BOT_JIRA_LABELS_INSIGHTS_RBAC
    - BOT_JIRA_PROJECT_INVENTORY_API
    - BOT_JIRA_TEAM_ID_INVENTORY_API
    - BOT_JIRA_LABELS_INVENTORY_API
