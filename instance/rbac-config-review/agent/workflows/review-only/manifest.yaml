name: review-only
type: workflow
description: Review labeled GitHub PRs across the configured repositories

preflight:
  - 01-review-queue.py

requires:
  mcp_servers:
    - bot-memory
    - mcp-atlassian
  env_vars:
    - BOT_INSTANCE_ID
    - BOT_MEMORY_URL
  optional_env_vars:
    # Sandbox deliveries (Vault-sourced via sandbox.env secret rendering).
    - FABRIC_TEAM_FIELD_ID
    - FABRIC_JIRA_PROJECT_INSIGHTS_RBAC
    - FABRIC_JIRA_TEAM_ID_INSIGHTS_RBAC
    - FABRIC_JIRA_TEAM_NAME_INSIGHTS_RBAC
    - FABRIC_JIRA_LABELS_INSIGHTS_RBAC
    - FABRIC_JIRA_PROJECT_INVENTORY_API
    - FABRIC_JIRA_TEAM_ID_INVENTORY_API
    - FABRIC_JIRA_TEAM_NAME_INVENTORY_API
    - FABRIC_JIRA_LABELS_INVENTORY_API
    - FABRIC_JIRA_PROJECT_INSIGHTS_CHROME
    - FABRIC_JIRA_TEAM_ID_INSIGHTS_CHROME
    - FABRIC_JIRA_TEAM_NAME_INSIGHTS_CHROME
    - FABRIC_JIRA_COMPONENT_ID_INSIGHTS_CHROME
    - FABRIC_JIRA_LABELS_INSIGHTS_CHROME
    # Legacy app-interface parameter names, used only outside the sandbox;
    # a sandbox delivery must arrive under its FABRIC_ name.
    - BOT_JIRA_PROJECT_INSIGHTS_RBAC
    - BOT_JIRA_TEAM_ID_INSIGHTS_RBAC
    - BOT_JIRA_TEAM_NAME_INSIGHTS_RBAC
    - BOT_JIRA_LABELS_INSIGHTS_RBAC
    - BOT_JIRA_PROJECT_INVENTORY_API
    - BOT_JIRA_TEAM_ID_INVENTORY_API
    - BOT_JIRA_TEAM_NAME_INVENTORY_API
    - BOT_JIRA_LABELS_INVENTORY_API
    - BOT_JIRA_PROJECT_INSIGHTS_CHROME
    - BOT_JIRA_TEAM_ID_INSIGHTS_CHROME
    - BOT_JIRA_TEAM_NAME_INSIGHTS_CHROME
    - BOT_JIRA_COMPONENT_ID_INSIGHTS_CHROME
    - BOT_JIRA_LABELS_INSIGHTS_CHROME
